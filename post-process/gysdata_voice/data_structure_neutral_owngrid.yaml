fdistribu:
  # the list of HDF5 datasets where this field can be found (this can also be a single dict)
  path:
    # file regex, in the regex we capture values that can be used in filename_coord (?P<NAME>CAPTURE)
    file: 'VOICEXX_\d+.h5'
    # dataset regex
    dataset: 'fdistribu'
  dimensions:
  - &timed
    time:    { local_coord: [ 'time_saved' ] }
  - &speciesd
    species: { constant_coord: [ 'electrons', 'ions' ] }
  - &xd
    x:       { global_coord: ["VOICEXX_initstate.h5", MeshX ] }
  - &vxd
    v_x: { global_coord: ['VOICEXX_initstate.h5', 'MeshVx'] }

fluid_moments:
  # the list of HDF5 datasets where this field can be found (this can also be a single dict)
  path:
    # file regex, in the regex we capture values that can be used in filename_coord (?P<NAME>CAPTURE)
    file: 'VOICEXX_\d+.h5'
    # dataset regex
    dataset: 'fluid_moments'
  dimensions:
  - *timed
  - &speciesnd
    speciesn: { constant_coord: [ 'neutrals' ] }
  - &momentd
    moment: { constant_coord: [ 'density' ] }
  - &xnd
    xn:       { global_coord: ["VOICEXX_initstate.h5", MeshNeutrals ] }

pressure_grad:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'pressure_grad'
  dimensions:
  - *timed
  - *speciesnd
  - *xnd

diff_coeff:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'diff_coeff'
  dimensions:
  - *timed
  - *speciesnd
  - *xnd

part_flux:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'part_flux'
  dimensions:
  - *timed
  - *speciesnd
  - *xnd

n_eq_ui:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'n_eq_ui'
  dimensions:
  - *timed
  - *speciesnd
  - *xnd

flux_grad:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'flux_grad'
  dimensions:
  - *timed
  - *speciesnd
  - *xnd

charge_exchange_rate:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'charge_exchange_rate'
  dimensions:
  - *timed
  - *xd

ionisation_rate:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'ionisation_rate'
  dimensions:
  - *timed
  - *xd

recombination_rate:
  path:
    file: 'VOICEXX_\d+.h5'
    dataset: 'recombination_rate'
  dimensions:
  - *timed
  - *xd

fdistribu_masses:
  dimensions: [ *speciesd ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'fdistribu_masses' }

neutrals_masses:
  dimensions: [ *speciesnd ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'neutrals_masses' }

normalisation_coeff_neutrals:
  dimensions: [ ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'normalisation_coeff_neutrals' }

norm_coeff_rate_neutrals:
  dimensions: [ ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'norm_coeff_rate_neutrals' }

charge_exchange_coefficients:
  dimensions:
    - cx: { constant_coord: [ '0', '1', '2', '3', '4' ] }
  path: { file: 'VOICEXX_initstate.h5', dataset: 'charge_exchange_coefficients' }

ionisation_slope_coefficients:
  dimensions:
    - i: { constant_coord: [ '0', '1', '2', '3', '4', '5' ] }
  path: { file: 'VOICEXX_initstate.h5', dataset: 'ionisation_slope_coefficients' }

ionisation_intercept_coefficients:
  dimensions:
    - i: { constant_coord: [ '0', '1', '2', '3', '4', '5' ] }
  path: { file: 'VOICEXX_initstate.h5', dataset: 'ionisation_intercept_coefficients' }

recombination_slope_coefficients:
  dimensions:
    - r: { constant_coord: [ '0', '1' ] }
  path: { file: 'VOICEXX_initstate.h5', dataset: 'recombination_slope_coefficients' }

recombination_intercept_coefficients:
  dimensions:
    - r: { constant_coord: [ '0', '1' ] }
  path: { file: 'VOICEXX_initstate.h5', dataset: 'recombination_intercept_coefficients' }

krook_neutrals_amplitude:
  dimensions: [ ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'krook_neutrals_amplitude' }

krook_neutrals_mask:
  dimensions: [ *xd ]
  path: { file: 'VOICEXX_initstate.h5', dataset: 'krook_neutrals_mask' }

