
stages:
  - static_analysis
  - test

.cmake_tests:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  stage: test
  timeout: 2 hours
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script: |
    set -x
    git config --global --add safe.directory ${CI_PROJECT_DIR}/gyselalibxx/vendor/kokkos
    rm -rf build || true
    mkdir build
    cd build
    cmake -DCMAKE_TOOLCHAIN_FILE=${CI_PROJECT_DIR}/gyselalibxx/toolchains/${TOOLCHAIN} ..
    cmake --build . -j 4
    ctest -j 2 --timeout 5 --output-junit tests.xml --output-on-failure
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: ./build/tests.xml


cmake_tests:
  extends: .cmake_tests
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    RELATIVE_RESTART_TOLERANCE: '0.0'
    ABSOLUTE_RESTART_TOLERANCE: '0.0'
    TOOLCHAIN: 'docker.gyselalibxx_env/tests_toolchain.cmake'

cmake_tests_Release:
  extends: .cmake_tests
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    RELATIVE_RESTART_TOLERANCE: '0.0'
    ABSOLUTE_RESTART_TOLERANCE: '0.0'
    TOOLCHAIN: 'docker.gyselalibxx_env/tests_release_toolchain.cmake'

cmake_tests_Release_OpenMP:
  extends: .cmake_tests
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    RELATIVE_RESTART_TOLERANCE: '0.0'
    ABSOLUTE_RESTART_TOLERANCE: '0.0'
    TOOLCHAIN: 'docker.gyselalibxx_env/tests_release_omp_toolchain.cmake'

cmake_tests_Release_GPU:
  extends: .cmake_tests
  tags:
    - persee
  variables:
    RELATIVE_RESTART_TOLERANCE: '1e-14'
    ABSOLUTE_RESTART_TOLERANCE: '1e-14'
    TOOLCHAIN: 'v100.persee/toolchain.cmake'
  before_script: |
    . ${CI_PROJECT_DIR}/gyselalibxx/toolchains/v100.persee/environment.sh

indentation:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: static_analysis
  needs: []
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script: |
    ./ci_tools/indent -td

python_best_practices:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: static_analysis
  needs: []
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    export PYTHONPATH="./post-process/PythonScripts"
  script: |
    # Find all files with a .py extension not in gyselalibxx
    PYTHON_FILES=$(find . -type f -name "*.py" ! -path "*/gyselalibxx/*")
    pylint ${PYTHON_FILES}

documentation:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: static_analysis
  needs: []
  image: ghcr.io/gyselax/gyselalibxx_env
  before_script: |
    git config --global --add safe.directory $CI_PROJECT_DIR
    git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} --recurse-submodules=no
    git config --global --add safe.directory ${CI_PROJECT_DIR}/gyselalibxx/vendor/kokkos
  script: |
    rm -rf build || true
    # Make docs
    cmake -DGYSELALIBXX_BUILD_DOCUMENTATION=1 -B build-docs .
    cmake --build build-docs --target doc

cppcheck_static_analysis:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: static_analysis
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script: |
    git config --global --add safe.directory $(pwd)
    git fetch --no-recurse-submodules origin ${CI_MERGE_REQUEST_DIFF_BASE_SHA}
  script: |
    git diff --name-only ${CI_MERGE_REQUEST_DIFF_BASE_SHA} > changed_files.txt
    CHANGED_FILES=$(awk '{printf("%s ",$0)} END { printf "\n" }' changed_files.txt)
    set +e
    python3 gyselalibxx/ci_tools/gyselalib_static_analysis.py ${CHANGED_FILES}
  allow_failure:
    exit_codes: [1, 2] # Allow failure due to style or error but not fatal

cmake_static_analysis:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  stage: static_analysis
  image: ghcr.io/gyselax/gyselalibxx_env
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script: |
    python3 gyselalibxx/ci_tools/cmake_checker.py
